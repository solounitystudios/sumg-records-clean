name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 50

      - name: Test
        # Compiles the node:test suites (tsconfig.catalog-test.json) and runs them.
        # Covers the SUMG-SEC-P0-004 privileged Server Action authorization invariant
        # (lib/youtube/thumbnails/actions.security.test.ts) plus the existing
        # lib/catalog and lib/cms security suites.
        run: npm run pretest && npm test

      - name: Build
        run: npm run build
        env:
          # Provide placeholder values so the build does not crash on env-var
          # lookups that are otherwise guarded by hasSupabase() / null checks.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder_key
